[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-chaser"
version = "0.1.0"
description = "An offline-first agent that chases group-project commitments."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["project_chaser*"]
